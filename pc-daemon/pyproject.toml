[tool.poetry]
name = "companion_daemon"
version = "0.1.0"
description = ""
authors = ["Iheb Kadri <ihebkadri70@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "companion_daemon" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
zeroconf = "^0.132.2"
cryptography = "^43.0.0"
fastapi = "^0.142.1"
uvicorn = "^0.54.0"
pystray = "^0.19.5"
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.8"
mypy = "^1.11.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "pystray"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
